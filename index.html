<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <h1 class="main-header">Enter Your Names To Begin</h1>
    <div class="input-container">
        <div>
            <div>
                <h3>Player One</h3>
                <input required id="player_one" name="player_one">
            </div>
            <div>
                <h3>Player Two</h3>
                <input required id="player_two" name="player_two">
            </div>
        </div>
        <button id="begin-button">Begin</button>

    </div>
    <div class="grid-container">
        <div data-index="0"></div>
        <div data-index="1"></div>
        <div data-index="2"></div>
        <div data-index="3"></div>
        <div data-index="4"></div>
        <div data-index="5"></div>
        <div data-index="6"></div>
        <div data-index="7"></div>
        <div data-index="8"></div>
    </div>
</body>
</html>
